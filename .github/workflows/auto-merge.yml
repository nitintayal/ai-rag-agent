name: Auto-merge hf-main to main

on:
  push:
    branches:
      - hf-main

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cherry-pick from hf-main to main
        run: |
          git config --global user.name "nitintayal"
          git config --global user.email "er.ntayal@gmail.com"
          
          # Get the latest commit hash from hf-main
          COMMIT_HASH=$(git rev-parse hf-main)
          echo "Cherry-picking commit: $COMMIT_HASH"
          
          git checkout main
          
          # Cherry-pick the commit
          git cherry-pick $COMMIT_HASH || {
            echo "Cherry-pick conflict detected. Aborting."
            git cherry-pick --abort
            exit 1
          }
          
          # Restore .env from main branch
          git checkout main -- .env
          git add .env
          git diff --staged --quiet || git commit --amend --no-edit
          
          git push origin main