services:
  - type: web
    name: ai-personal-assistant
    runtime: python
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: data/db/assistant.db
      - key: DATA_DIR
        value: data/files
      - key: STORAGE_DIR
        value: data/storage
      - key: MEMORY_EXTRACTION_ENABLED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
